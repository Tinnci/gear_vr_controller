name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Windows quality and distributable
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install dependency checker
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: Run shared quality gate
        run: ./scripts/quality.ps1
      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag must match Cargo version v$version" }
      - name: Build and smoke-test complete package
        run: ./scripts/package.ps1
      - name: Save verified distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-distribution
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Save diagnostic symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-symbols
          path: dist/*.pdb
          if-no-files-found: error
