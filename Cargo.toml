[package]
name = "gear_vr_controller_rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native Windows Bluetooth LE input bridge for Samsung Gear VR controllers"
repository = "https://github.com/Tinnci/gear_vr_controller"
license = "MIT"

[lints.clippy]
expect_used = "warn"
panic = "warn"
todo = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
type_complexity = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[dependencies]
# GUI frameworks
windows-reactor = "0.100.0"

# Async runtime
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

# Serialization for settings
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "fmt",
    "registry",
    "std",
] }

# Error handling
anyhow = "1.0.103"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

[build-dependencies]
windows-reactor-setup = "0.100.0"
winresource = "0.1.30"

[profile.release]
# Keep line information in a separate PDB for diagnosing release failures.
debug = "limited"
